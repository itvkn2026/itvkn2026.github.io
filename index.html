<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VKN Studentu Darbi</title>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="favicon.png">

  <style>
    :root {
      --bg-page:        #ffffff;
      --text-btn:       #000000;
      --text-btn-hover: #2124d6;
      --text-label:     #888888;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "VT323", monospace;
      background: var(--bg-page);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      text-align: center;
    }

    h1 {
      font-size: clamp(48px, 8vw, 110px);
      font-weight: 400;
      line-height: 1;
      margin-bottom: 4rem;
      color: var(--text-btn);
    }

    section + section { margin-top: 3rem; }

    h2 {
      font-size: 28px;
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--text-label);
      margin-bottom: 0.75rem;
    }

    .menu-link {
      display: block;
      font-size: 45px;
      line-height: 1.3;
      text-decoration: none;
      color: var(--text-btn);
      transition: color 0.15s;
    }

    .menu-link:hover { color: var(--text-btn-hover); }

    @media (max-width: 1100px) {
      .menu-link { font-size: 34px; }
    }

    @media (max-width: 500px) {
      h1 { margin-bottom: 2.5rem; }
      h2 { font-size: 20px; }
      .menu-link { font-size: 26px; }
      section + section { margin-top: 2rem; }
    }
  </style>
</head>
<body>

  <main>
    <h1>VKN STUDENTU DARBI</h1>

    <section>
      <h2>Portfolio</h2>
      <a class="menu-link" href="ba2-2026.html">VKN BA2 2026 Portfolio</a>
      <a class="menu-link" href="ma2-2026.html">VKN MA2 2026 Portfolio</a>
    </section>

    <section>
      <h2>Unity</h2>
      <a class="menu-link" href="ba3-2026-unity.html">VKN BA3 2026 Unity</a>
    </section>
  </main>

</body>
</html>
